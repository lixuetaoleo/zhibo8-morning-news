name: Update Zhibo8 Football Latest RSS

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - latest.js
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/update_latest_rss.yml

permissions:
  contents: write

concurrency:
  group: zhibo8-football-latest-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/football_latest.xml
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test feed generation
        run: node --test tests/latest.test.js

      - name: Generate football latest RSS
        run: node latest.js

      - name: Commit and push feed changes
        run: |
          git add -- football_latest.xml
          if git diff --cached --quiet -- football_latest.xml; then
            echo "RSS feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update football latest RSS"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
