name: Update Zhibo8 RSS

on:
  schedule:
    # 北京时间 07:11 至 12:41，每半小时检查一次。
    - cron: '11,41 0-4,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.js
      - tests/morning.test.js
      - .github/workflows/update_rss.yml

permissions:
  contents: write

concurrency:
  group: zhibo8-football-morning-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/football_morning_news.xml
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test morning feed generation
        run: node --test tests/morning.test.js

      - name: Generate football morning RSS
        run: node index.js

      - name: Commit and push feed changes
        run: |
          git add -- football_morning_news.xml
          if git diff --cached --quiet -- football_morning_news.xml; then
            echo "Morning RSS feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update football morning RSS"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$DEFAULT_BRANCH" && git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done
          echo "Failed to push morning RSS after 3 attempts." >&2
          exit 1
